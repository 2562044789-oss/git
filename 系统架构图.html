<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  text{font-family:"SimSun","宋体",serif;fill:#000;}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <!-- 标题 -->
  <text x="700" y="40" font-size="24" font-weight="bold" text-anchor="middle">阳光社区邻里快办服务系统架构图</text>

  <!-- ===== 表现层 ===== -->
  <rect x="80" y="80" width="1240" height="150" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="80" y="80" width="140" height="40" fill="none" stroke="#000" stroke-width="2"/>
  <text x="150" y="107" font-size="16" font-weight="bold" text-anchor="middle">表现层</text>
  <text x="700" y="107" font-size="14" text-anchor="middle">（用户交互层）</text>
  <!-- 两个端 -->
  <rect x="350" y="140" width="300" height="70" fill="none" stroke="#000"/>
  <text x="500" y="168" font-size="15" font-weight="bold" text-anchor="middle">微信小程序端</text>
  <text x="500" y="192" font-size="13" text-anchor="middle">原生 WXML/WXSS/JS，面向居民与跑腿者</text>

  <rect x="750" y="140" width="300" height="70" fill="none" stroke="#000"/>
  <text x="900" y="168" font-size="15" font-weight="bold" text-anchor="middle">Web 管理后台</text>
  <text x="900" y="192" font-size="13" text-anchor="middle">原生 HTML/CSS/JS，面向系统管理员</text>

  <!-- 箭头向下 -->
  <line x1="700" y1="230" x2="700" y2="260" stroke="#000" stroke-width="2"/>
  <polygon points="694,256 706,256 700,266" fill="#000"/>

  <!-- ===== 接口层 ===== -->
  <rect x="80" y="270" width="1240" height="150" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="80" y="270" width="140" height="40" fill="none" stroke="#000" stroke-width="2"/>
  <text x="150" y="297" font-size="16" font-weight="bold" text-anchor="middle">接口层</text>
  <text x="700" y="297" font-size="14" text-anchor="middle">（API 接入层）</text>

  <g font-size="13">
    <rect x="150" y="330" width="230" height="70" fill="none" stroke="#000"/>
    <text x="265" y="358" font-size="14" font-weight="bold" text-anchor="middle">RESTful 接口</text>
    <text x="265" y="382" text-anchor="middle">统一 JSON 响应封装</text>

    <rect x="400" y="330" width="230" height="70" fill="none" stroke="#000"/>
    <text x="515" y="358" font-size="14" font-weight="bold" text-anchor="middle">身份鉴权</text>
    <text x="515" y="382" text-anchor="middle">JWT 令牌校验、角色拦截</text>

    <rect x="650" y="330" width="230" height="70" fill="none" stroke="#000"/>
    <text x="765" y="358" font-size="14" font-weight="bold" text-anchor="middle">访问控制</text>
    <text x="765" y="382" text-anchor="middle">接口限流、参数校验</text>

    <rect x="900" y="330" width="230" height="70" fill="none" stroke="#000"/>
    <text x="1015" y="358" font-size="14" font-weight="bold" text-anchor="middle">静态资源服务</text>
    <text x="1015" y="382" text-anchor="middle">上传图片、页面静态文件</text>
  </g>

  <line x1="700" y1="420" x2="700" y2="450" stroke="#000" stroke-width="2"/>
  <polygon points="694,446 706,446 700,456" fill="#000"/>

  <!-- ===== 业务逻辑层 ===== -->
  <rect x="80" y="460" width="1240" height="180" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="80" y="460" width="140" height="40" fill="none" stroke="#000" stroke-width="2"/>
  <text x="150" y="487" font-size="16" font-weight="bold" text-anchor="middle">业务逻辑层</text>
  <text x="700" y="487" font-size="14" text-anchor="middle">（核心业务层）</text>

  <g font-size="13">
    <rect x="120" y="520" width="200" height="100" fill="none" stroke="#000"/>
    <text x="220" y="548" font-size="14" font-weight="bold" text-anchor="middle">用户与认证</text>
    <text x="220" y="572" text-anchor="middle">微信登录、资料、地址</text>
    <text x="220" y="594" text-anchor="middle">接单员实名、保证金管理</text>

    <rect x="335" y="520" width="200" height="100" fill="none" stroke="#000"/>
    <text x="435" y="548" font-size="14" font-weight="bold" text-anchor="middle">任务与订单</text>
    <text x="435" y="572" text-anchor="middle">任务发布、接单</text>
    <text x="435" y="594" text-anchor="middle">订单状态机流转</text>

    <rect x="550" y="520" width="200" height="100" fill="none" stroke="#000"/>
    <text x="650" y="548" font-size="14" font-weight="bold" text-anchor="middle">钱包与结算</text>
    <text x="650" y="572" text-anchor="middle">余额托管、充值提现</text>
    <text x="650" y="594" text-anchor="middle">结算、退款、流水</text>

    <rect x="765" y="520" width="200" height="100" fill="none" stroke="#000"/>
    <text x="865" y="548" font-size="14" font-weight="bold" text-anchor="middle">投诉与裁决</text>
    <text x="865" y="572" text-anchor="middle">投诉受理、资金冻结</text>
    <text x="865" y="594" text-anchor="middle">退款/结算/驳回裁决</text>

    <rect x="980" y="520" width="200" height="100" fill="none" stroke="#000"/>
    <text x="1080" y="548" font-size="14" font-weight="bold" text-anchor="middle">公共支撑</text>
    <text x="1080" y="572" text-anchor="middle">图片上传、评价</text>
    <text x="1080" y="594" text-anchor="middle">消息通知、审计日志</text>
  </g>

  <line x1="700" y1="640" x2="700" y2="670" stroke="#000" stroke-width="2"/>
  <polygon points="694,666 706,666 700,676" fill="#000"/>

  <!-- ===== 数据持久层 ===== -->
  <rect x="80" y="680" width="1240" height="150" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="80" y="680" width="140" height="40" fill="none" stroke="#000" stroke-width="2"/>
  <text x="150" y="707" font-size="16" font-weight="bold" text-anchor="middle">数据持久层</text>
  <text x="700" y="707" font-size="14" text-anchor="middle">（数据存储层）</text>

  <g font-size="13">
    <rect x="180" y="740" width="280" height="70" fill="none" stroke="#000"/>
    <text x="320" y="768" font-size="14" font-weight="bold" text-anchor="middle">关系型数据库</text>
    <text x="320" y="792" text-anchor="middle">SQLite（演示）/ MySQL（生产）</text>

    <rect x="510" y="740" width="280" height="70" fill="none" stroke="#000"/>
    <text x="650" y="768" font-size="14" font-weight="bold" text-anchor="middle">数据表</text>
    <text x="650" y="792" text-anchor="middle">用户、任务、订单、钱包、投诉等</text>

    <rect x="840" y="740" width="280" height="70" fill="none" stroke="#000"/>
    <text x="980" y="768" font-size="14" font-weight="bold" text-anchor="middle">事务与文件存储</text>
    <text x="980" y="792" text-anchor="middle">事务一致性控制、上传图片落盘</text>
  </g>

</svg>
</body>
</html>
